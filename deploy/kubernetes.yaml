apiVersion: v1
kind: Namespace
metadata: { name: silo }
---
apiVersion: v1
kind: Service
metadata: { name: silo-api, namespace: silo }
spec: { selector: { app: silo-api }, ports: [{ name: http, port: 80, targetPort: 4173 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: silo-api, namespace: silo }
spec:
  replicas: 1
  selector: { matchLabels: { app: silo-api } }
  template:
    metadata: { labels: { app: silo-api } }
    spec:
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: api
          image: ghcr.io/your-org/silo:latest
          ports: [{ containerPort: 4173 }]
          envFrom: [{ secretRef: { name: silo-secrets } }]
          volumeMounts: [{ name: data, mountPath: /app/data }]
          readinessProbe: { httpGet: { path: /api/health, port: 4173 }, initialDelaySeconds: 3 }
          livenessProbe: { httpGet: { path: /api/health, port: 4173 }, initialDelaySeconds: 10 }
          resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: silo-data } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: silo-worker, namespace: silo }
spec:
  replicas: 3
  selector: { matchLabels: { app: silo-worker } }
  template:
    metadata: { labels: { app: silo-worker } }
    spec:
      runtimeClassName: gvisor
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: ghcr.io/your-org/silo:latest
          command: [node, worker.mjs]
          envFrom: [{ secretRef: { name: silo-secrets } }]
          env: [{ name: SILO_WORKER_TYPES, value: "agent,build" }]
          resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny, namespace: silo }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-required-traffic, namespace: silo }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: [{ ports: [{ protocol: TCP, port: 4173 }] }]
  egress:
    - ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }, { protocol: TCP, port: 80 }, { protocol: TCP, port: 443 }, { protocol: TCP, port: 6379 }, { protocol: TCP, port: 6380 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: silo-data, namespace: silo }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 20Gi } } }
